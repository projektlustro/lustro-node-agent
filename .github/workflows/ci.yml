name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --tb=short

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # dhi.io rate-limits anonymous pulls per-IP; GitHub-hosted runners share
      # a small IP pool that other repos' anonymous DHI pulls already
      # saturate (confirmed: 429 Too Many Requests on an unauthenticated
      # build). Authenticated pulls get a much higher/no quota.
      - uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      - run: docker build -t node-agent .
      - run: docker build -f Dockerfile.nlp-e5 -t node-agent-nlp-e5 .
      - run: docker build -f Dockerfile.nlp-pko -t node-agent-nlp-pko .
      - name: Verify production core key is baked into the image
        run: |
          value="$(docker image inspect node-agent \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | sed -n 's/^LUSTRO_NODE_AGENT_PINNED_KEY_B64=//p')"
          test -n "$value"

  docker-publish:
    needs: [test, docker-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - image: node-agent
            dockerfile: Dockerfile
          - image: node-agent-nlp-e5
            dockerfile: Dockerfile.nlp-e5
          - image: node-agent-nlp-pko
            dockerfile: Dockerfile.nlp-pko
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"
